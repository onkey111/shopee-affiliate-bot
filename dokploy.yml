# ==============================================================================
# Dokploy Configuration
# ==============================================================================
# This file configures deployment settings for Dokploy platform
# Documentation: https://docs.dokploy.com
# ==============================================================================

# Application name
name: shopee-affiliate-bot

# Build configuration
build:
  # Use Dockerfile for building
  type: dockerfile
  dockerfile: Dockerfile
  context: .

# Service configuration
services:
  # Main application
  app:
    # Port the application listens on
    port: 3000
    
    # Health check configuration
    healthCheck:
      enabled: true
      path: /health
      interval: 30
      timeout: 10
      retries: 3
      startPeriod: 60
    
    # Resource limits
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
    
    # Replicas (single instance for Telegram bot webhook)
    replicas: 1
    
    # Environment variables (set in Dokploy dashboard)
    # Required:
    #   - BOT_TOKEN
    #   - WEBHOOK_URL (auto-generated by Dokploy: https://your-app.dokploy.com/webhook/bot)
    #   - DB_PASSWORD (use strong password)
    #   - SESSION_SECRET (generate random string)
    #   - ADMIN_PASSWORD (use strong password)
    # Optional:
    #   - ADMIN_ALERT_TELEGRAM_ID
    #   - REDIS_PASSWORD
    #   - BROWSER_POOL_MIN (default: 2)
    #   - BROWSER_POOL_MAX (default: 5)

# Database configuration (PostgreSQL)
databases:
  postgres:
    type: postgresql
    version: "15"
    # Database will be auto-created by Dokploy
    # Connection string will be injected as DATABASE_URL

# Cache configuration (Redis)
caches:
  redis:
    type: redis
    version: "7"
    # Redis URL will be injected as REDIS_URL

# Volumes for persistent data
volumes:
  - name: app-data
    path: /app/data
  - name: cookies
    path: /app/.cookies.json
    # Note: Upload .cookies.json via Dokploy file manager

# Domain configuration (set in Dokploy dashboard)
# domains:
#   - domain: your-bot.example.com
#     ssl: true

