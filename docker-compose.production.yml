# ==============================================================================
# Shopee Affiliate Telegram Bot - Production Docker Compose Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.production.yml up -d
# ==============================================================================
# This file contains production-specific overrides:
# - Removes port exposure for internal services (postgres, redis)
# - Adds resource limits
# - Configures logging
# ==============================================================================

version: '3.8'

services:
  # =============================================================================
  # Application Service - Production Overrides
  # =============================================================================
  app:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =============================================================================
  # PostgreSQL - Production Overrides
  # =============================================================================
  postgres:
    restart: always
    # Remove external port exposure in production
    ports: []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # =============================================================================
  # Redis - Production Overrides
  # =============================================================================
  redis:
    restart: always
    # Remove external port exposure in production
    ports: []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

